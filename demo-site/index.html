<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TestPilot Demo - Sign in</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 10vh auto; padding: 0 16px; color: #20263a; background: #f7f8fb; }
    form { display: grid; gap: 10px; padding: 24px; border: 1px solid #e1e4ec; border-radius: 12px; background: #fff; }
    input { height: 36px; padding: 0 10px; border: 1px solid #d5d8e1; border-radius: 6px; }
    button { height: 38px; border: 0; border-radius: 6px; color: #fff; background: #6865d9; font-weight: 700; cursor: pointer; }
    .error { min-height: 1.2em; color: #a24045; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Sign in to the demo</h1>
  <p>This page exists only as an authorized TestPilot AI demo target. It sends no data anywhere.</p>
  <form id="sign-in" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="off">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="off">
    <p id="message" class="error" role="alert"></p>
    <button id="sign-in-button" type="submit">Sign in</button>
  </form>
  <p><a href="broken.html">Open the intentionally broken page</a></p>
</main>
  <script>
    document.getElementById("sign-in").addEventListener("submit", (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");
      if (!email) message.textContent = "Email is required";
      else if (!password) message.textContent = "Password is required";
      else message.textContent = "Demo only: credentials are never sent.";
    });
  </script>
</body>
</html>
