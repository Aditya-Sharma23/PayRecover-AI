# Publishes demo-site/ to GitHub Pages so the demo has an authorized public target.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Publish demo site

on:
  push:
    branches: [main]
    paths: ["demo-site/**", ".github/workflows/demo-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-site
      - id: deployment
        uses: actions/deploy-pages@v4
