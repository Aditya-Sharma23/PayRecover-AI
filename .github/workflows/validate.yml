name: Validate TestPilot AI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t testpilot-ai:ci .
      - name: Container starts and serves the API and dashboard
        run: |
          docker run -d --name testpilot -p 127.0.0.1:8000:8000 testpilot-ai:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/ | grep -q "TestPilot AI"
          docker rm -f testpilot
      - name: Public mode refuses to start without its safeguards
        run: |
          set +e
          docker run --rm -e TESTPILOT_PUBLIC_DEPLOYMENT=true testpilot-ai:ci timeout 30 uvicorn app.main:app --port 8001
          code=$?
          # 124 would mean it kept running until the timeout, i.e. it did start.
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then echo "expected the server to refuse to start"; exit 1; fi
          echo "refused to start as expected (exit $code)"
